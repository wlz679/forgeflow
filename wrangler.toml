name = "forgeflowkit"
compatibility_date = "2026-08-31"
pages_build_output_dir = "dist"

# Both bindings (R2 bucket FEEDBACK_BUCKET, KV namespace FEEDBACK_KV)
# are configured via CF Dashboard:
#   Pages → forgeflow → Settings → Functions → R2/KV bindings.
#
# Declaring them here with placeholder values (e.g. R2 bucket_name
# "forgeflowkit-feedback" pointing at a non-existent bucket, or KV id
# "REPLACE_WITH_KV_NAMESPACE_ID") caused CF Pages Function publish to
# fail with errors:
#   - Error 8000022: Invalid KV namespace ID
#   - "R2 bucket 'forgeflowkit-feedback' not found"
#
# The feedback API (src/pages/api/feedback.ts) gracefully returns
# 503 when these env bindings are missing, so site content pages are
# unaffected. If you want the feedback API live in production, create
# the actual R2 bucket + KV namespace in the CF dashboard and link
# them to this Pages project — the same binding names (FEEDBACK_BUCKET,
# FEEDBACK_KV) will be picked up at runtime.

[vars]
NODE_VERSION = "20"
