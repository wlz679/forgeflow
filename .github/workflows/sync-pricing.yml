name: Sync AI Pricing

# Weekly cron + manual trigger
# Pulls latest LLM pricing from LiteLLM, regenerates engine customFn data
# tables, and — since P153 §7.18 (E9) — opens a Pull Request against
# master instead of pushing straight to master.
#
# Why a PR and not a direct push: a commit pushed with GITHUB_TOKEN does
# NOT trigger a CI run (GitHub skips workflow runs for GITHUB_TOKEN
# pushes), but it DOES trigger the Cloudflare Pages deploy webhook. The
# old "commit + push to master" therefore shipped pricing to production
# without ever being tested — one untested deploy per week. A PR gets a
# normal CI run (ci.yml has a `pull_request:` trigger) and a human merge.

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday 06:00 UTC = 14:00 Beijing
  workflow_dispatch: # Manual trigger
  push:
    # P153 §7.18 (E9) — the branch filter is now load-bearing. This trigger
    # has a `paths:` filter that matches `src/data/ai-pricing.json` and
    # `scripts/sync-pricing.mjs` — exactly the files the bot itself
    # commits. Since the bot now pushes to `chore/pricing-sync`, an
    # unfiltered `push:` trigger would re-fire the workflow on the bot's
    # own push (loop). Restricting `push:` to master means only a human
    # landing a change on master re-runs the bot.
    # Belt and braces: the job also carries
    # `if: github.event_name != 'push' || github.ref == 'refs/heads/master'`.
    # (GITHUB_TOKEN pushes do not trigger workflows at all — but we do not
    # rely on that alone.)
    branches: [master]
    paths:
      - 'src/data/ai-pricing.json'
      - 'scripts/sync-pricing.mjs'
      - 'scripts/codegen-customfn.mjs'
      - 'scripts/codegen-examples.mjs'
      - '.github/workflows/sync-pricing.yml'

jobs:
  sync:
    # P153 §7.18 (E9) — belt-and-braces loop guard. The `push:` branch
    # filter above already keeps the bot's own branch push out; this guard
    # makes that safe even if that filter is ever widened. schedule and
    # workflow_dispatch are exempt: they always run against master's tip.
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30    # mirror ci.yml:20 — avoid 6h default hang on stuck job
    permissions:
      contents: write         # push the bot branch
      pull-requests: write    # open / update the PR (P153 §7.18 E9)
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Stable branch name: one open PR at a time, refreshed every week.
      # See the "Commit pricing sync to bot branch" step for why reusing it
      # is safe.
      BOT_BRANCH: chore/pricing-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the bot branch is rebuilt from master's tip, and
          # `gh pr create` has to resolve master as the PR base. A shallow
          # clone makes both the push and the base resolution needlessly
          # fragile. ~59 MB .git as of 2026-10-22 — cheap for a weekly job.
          fetch-depth: 0

      # P153: pin pnpm to the SAME major ci.yml uses (9). This step used to be
      # `npm install -g pnpm`, which floats to the latest major and made this
      # workflow a hostage to pnpm's release cadence: pnpm 12 fails
      # `pnpm install --frozen-lockfile` with ERR_PNPM_IGNORED_BUILDS (10
      # dependencies have build scripts; pnpm >=10 blocks them by default and
      # pnpm >=12 turns "blocked" into a hard install failure). Verified
      # 2026-10-22: pnpm 12.14.0 reproduces it on this very lockfile, pnpm 9
      # installs it cleanly. The workflow had been red at this step since
      # 2026-10-05 (runs 37320094551 / 39251857722 / 39707689389).
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Sync pricing from LiteLLM
        run: node scripts/sync-pricing.mjs

      - name: Regenerate engine customFn data
        run: node scripts/codegen-customfn.mjs

      - name: Regenerate engine static examples
        run: node scripts/codegen-examples.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/data/ai-pricing.json src/engines/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit pricing sync to bot branch
        id: commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebuild the bot branch from master's tip (the commit checked out
          # above) so the PR diff contains ONLY this week's pricing delta —
          # not last week's commit on top of last week's commit.
          git checkout -B "$BOT_BRANCH"
          git add src/data/ai-pricing.json src/engines/
          MSG="chore(pricing): sync from LiteLLM + regen customFn + staticExamples ($(date -u +%Y-%m-%d)) - opens PR"
          git commit -m "$MSG"
          # --force (not --force-with-lease) is safe here: `chore/pricing-sync`
          # is bot-owned. It only ever receives bot-generated pricing
          # commits, is never hand-edited, and is rebuilt from master's tip
          # on every run — so overwriting it discards nothing a human
          # authored. --force-with-lease was rejected deliberately: the
          # branch may not exist on the remote yet, and git's lease check
          # then refuses the very first push of a brand-new branch.
          #
          # The push URL is built from GITHUB_SERVER_URL/GITHUB_REPOSITORY
          # instead of the name `origin` on purpose: this repo uses a 3-way
          # remote setup where the LOCAL `origin` is Gitee
          # (git@gitee.com:wlz679/calcKit.git) and GitHub is the `github`
          # remote, while in CI actions/checkout names the GitHub remote
          # `origin`. Addressing the URL directly guarantees the branch
          # lands in the SAME repo the PR is opened against
          # (gh pr create --repo "$REPO"), whatever the remote is called.
          # Auth: actions/checkout persists an extraheader credential for
          # https://github.com/, which covers this URL.
          git push --force "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$BOT_BRANCH"
          echo "message=$MSG" >> "$GITHUB_OUTPUT"

      - name: Open or update Pull Request
        id: pr
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_PROMPT_DISABLED: '1'
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ steps.commit.outputs.message }}
          PR_BODY: |
            🤖 **Automated pricing sync** — opened by `Sync AI Pricing`.

            - Source: LiteLLM pricing snapshot + regenerated engine customFn
              data tables and static examples.
            - This PR is **not** merged automatically. It waits for a normal
              `CI` run (ci.yml has a `pull_request:` trigger) and a human
              merge, so nothing reaches production untested.
            - The branch `chore/pricing-sync` is bot-owned and is force-pushed
              on every sync; do not commit to it by hand.

            Commit: ${{ steps.commit.outputs.message }}
        run: |
          # NOTE: intentionally NOT `set -e`. Every gh call below is checked
          # explicitly so that a failure produces (a) a readable reason in the
          # job summary and (b) a fallback the human can act on. The 2026-10-26
          # run failed with a bare "Process completed with exit code 1" and the
          # reason was invisible — the old code swallowed gh's stderr with
          # `2>/dev/null` and used `gh pr view <branch>`, whose failure mode
          # ("no PR" vs "API refused") is indistinguishable from the exit code.
          set -uo pipefail
          SUMMARY="$GITHUB_STEP_SUMMARY"

          {
            echo "### 🤖 Pricing sync — PR"
            echo ""
            echo "- repo: \`$REPO\`"
            echo "- branch: \`$BOT_BRANCH\`"
            echo "- base: \`master\`"
            echo "- head sha: \`$(git rev-parse HEAD)\`"
            echo "- gh: \`$(gh --version | head -1)\`"
            echo ""
          } >> "$SUMMARY"

          # --- 1. Diagnostics -----------------------------------------------------
          # `can_approve_pull_request_reviews` is the repo-level switch that
          # decides whether GITHUB_TOKEN may create pull requests at all. When
          # it is false, `gh pr create` fails with a bare 403 and no useful
          # message — printing it here makes that visible without log access.
          echo "**token / repo permissions**" >> "$SUMMARY"
          echo '```' >> "$SUMMARY"
          # `GH_TOKEN` is provided by the JOB-level `env:` block. If it ever
          # goes missing, every `gh` call below fails with a generic auth
          # error and the step dies with no usable reason — so say it plainly.
          if [ -n "${GH_TOKEN:-}" ]; then
            echo "GH_TOKEN: present (length ${#GH_TOKEN})"
          else
            echo "GH_TOKEN: *** MISSING *** — the job-level env: block did not provide it;"
            echo "every gh call in this step will fail with an auth error."
          fi
          gh auth status >> "$SUMMARY" 2>&1 || true
          gh api "repos/$REPO/actions/permissions" >> "$SUMMARY" 2>&1 || true
          gh api "repos/$REPO/actions/permissions/workflow" >> "$SUMMARY" 2>&1 || true
          echo '```' >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          # --- 2. Find an existing OPEN PR for the bot branch ---------------------
          # `gh api .../pulls?head=owner:branch` is used instead of
          # `gh pr view <branch>`: the API returns an empty array (exit 0) for
          # "no PR" and a non-zero exit for a real API error, so the two cases
          # can finally be told apart.
          #
          # ⚠️ The `head` filter is `owner:branch` — NOT `owner/repo:branch`.
          # Measured against the live API on 2026-10-27: the wrong form
          # (`wlz679/forgeflow:chore/pricing-sync`) does NOT error — it returns
          # HTTP 200 with an empty array, i.e. it silently claims "no PR
          # exists" forever, and the step would then walk into `gh pr create`
          # and die on "a pull request already exists". Use
          # $GITHUB_REPOSITORY_OWNER, never $REPO, for the owner half.
          HEAD_FILTER="${GITHUB_REPOSITORY_OWNER}:$BOT_BRANCH"
          PR_JSON="$(gh api "repos/$REPO/pulls?state=open&head=$HEAD_FILTER" 2>"$RUNNER_TEMP/ffk-pr-list.err")"
          if [ $? -ne 0 ]; then
            echo "**could not list PRs**" >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            cat "$RUNNER_TEMP/ffk-pr-list.err" >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            echo "" >> "$SUMMARY"
          fi
          PR_NUMBER="$(printf '%s' "$PR_JSON" | jq -r '.[0].number // empty' 2>/dev/null || true)"

          # --- 3. Create or update ------------------------------------------------
          if [ -n "$PR_NUMBER" ]; then
            echo "PR #\`$PR_NUMBER\` already exists on \`$BOT_BRANCH\` — updating title/body." >> "$SUMMARY"
            if ! gh pr edit "$PR_NUMBER" --repo "$REPO" --title "$PR_TITLE" --body "$PR_BODY" >>"$SUMMARY" 2>&1; then
              echo "::error::gh pr edit #$PR_NUMBER failed — see the job summary above"
              exit 1
            fi
          else
            echo "No open PR on \`$BOT_BRANCH\` — creating one." >> "$SUMMARY"
            CREATE_OUT="$(gh pr create --repo "$REPO" --base master --head "$BOT_BRANCH" \
              --title "$PR_TITLE" --body "$PR_BODY" 2>>"$SUMMARY")"
            CREATE_RC=$?
            if [ $CREATE_RC -ne 0 ]; then
              echo "" >> "$SUMMARY"
              echo "**gh pr create failed (exit $CREATE_RC).** The branch IS pushed — open the PR by hand:" >> "$SUMMARY"
              echo "" >> "$SUMMARY"
              echo "\`${GITHUB_SERVER_URL}/${REPO}/compare/master...${BOT_BRANCH}?expand=1\`" >> "$SUMMARY"
              echo "::error::gh pr create failed — the bot branch is pushed; open the PR manually (link in the job summary)"
              exit 1
            fi
            # gh prints the PR URL on stdout; pull the number out of the URL.
            # NOTE: do NOT strip non-digits — "wlz679" in the owner name would
            # bleed into the number.
            PR_NUMBER="$(printf '%s' "$CREATE_OUT" | grep -oE '/pull/[0-9]+' | head -n 1 | grep -oE '[0-9]+' || true)"
          fi

          # --- 4. Verify — never report success on a guess ------------------------
          #
          # A PR is normally visible through the API the instant it is created,
          # but there IS a short propagation window. A single read-back that
          # races it reports "PR not found" for a PR that does exist — and the
          # next weekly run then says "a PR already exists" and updates it,
          # which reads like flapping rather than like the race it is. So the
          # read-back is retried a few times before it is called a failure.
          # The property being protected is unchanged: **success is only ever
          # reported after the API actually shows the PR.**
          VERIFY_URL=""
          for _attempt in 1 2 3 4 5; do
            VERIFY_URL="$(gh api "repos/$REPO/pulls?state=open&head=$HEAD_FILTER" --jq '.[0].html_url // empty' 2>>"$SUMMARY" || true)"
            if [ -n "$VERIFY_URL" ]; then
              break
            fi
            echo "read-back attempt $_attempt: PR not visible yet — retrying in 3s" >> "$SUMMARY"
            sleep 3
          done
          if [ -z "$VERIFY_URL" ]; then
            echo "::error::PR #$PR_NUMBER was not found by the API after create/update — treating as failure"
            echo "**Verification failed:** PR #$PR_NUMBER is not visible via the API." >> "$SUMMARY"
            exit 1
          fi
          URL="$VERIFY_URL"

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "**PR: [$PR_NUMBER]($URL)**"
          } >> "$SUMMARY"
          echo "PR: $URL"

      - name: No pricing changes
        if: steps.diff.outputs.changed != 'true'
        run: |
          echo "LiteLLM pricing and the regenerated tables are unchanged — no commit, no PR." >> "$GITHUB_STEP_SUMMARY"
